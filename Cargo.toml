[workspace]
resolver = "3"
members = ["crates/common", "crates/agent", "crates/gui"]

[workspace.package]
# Airgorah-RT — a fork of Airgorah (https://github.com/martin-olivier/airgorah)
# by Martin Olivier, maintained by Syed Muhammad Tayyab. See README.md
# "Based on Airgorah" section and NOTICE.md for full attribution.
version = "0.9.0-rt1"
edition = "2024"
license = "MIT"
authors = [
    "Martin Olivier <martin.olivier@live.fr> (original Airgorah author)",
    "Syed Muhammad Tayyab <https://github.com/Syed-Muhammad-Tayyab> (Airgorah-RT fork maintainer)",
]
homepage = "https://github.com/Syed-Muhammad-Tayyab/Airgorah-RT"
repository = "https://github.com/Syed-Muhammad-Tayyab/Airgorah-RT"
documentation = "https://github.com/Syed-Muhammad-Tayyab/Airgorah-RT/wiki"
readme = "README.md"

[workspace.dependencies]
airgorah-common = { path = "crates/common", version = "0.9.0-rt1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.13"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
nix = { version = "0.31", features = ["signal", "socket", "user", "fs"] }
which = "8"
lazy_static = "1"
